<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowminds AI - Career Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1220;
    --ink:#121A2B;
    --paper:#F7F7FB;
    --amber:#FFB020;
    --violet:#7C5CFF;
    --slate:#5B6478;
    --line:#232D42;
    --white:#FFFFFF;
    --glow: radial-gradient(circle at 30% 30%, var(--amber), transparent 60%),
             radial-gradient(circle at 70% 70%, var(--violet), transparent 60%);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.55;
  }
  h1,h2,h3,h4{font-family:'Sora', sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ===== Top Bar ===== */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:var(--navy);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1200px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; color:var(--white);}
  .brand .dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--glow);
    box-shadow:0 0 14px 3px rgba(255,176,32,0.55);
  }
  .brand span{font-family:'Sora'; font-weight:800; font-size:1.15rem; letter-spacing:-0.02em;}
  .brand small{display:block; font-family:'JetBrains Mono'; font-size:0.62rem; color:#9AA5C0; letter-spacing:0.12em; text-transform:uppercase;}

  .tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .tab-btn{
    font-family:'Inter'; font-weight:600; font-size:0.82rem;
    color:#C6CDE0; background:transparent; border:1px solid transparent;
    padding:8px 14px; border-radius:999px; cursor:pointer; transition:.2s;
    white-space:nowrap;
  }
  .tab-btn:hover{color:var(--white); border-color:var(--line);}
  .tab-btn.active{
    color:var(--navy); background:linear-gradient(120deg, var(--amber), #FFD37A);
    box-shadow:0 4px 14px rgba(255,176,32,0.35);
  }

  /* ===== Hero per page ===== */
  .page{display:none; animation:fade .35s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .hero{
    position:relative; overflow:hidden;
    background:var(--navy); color:var(--white);
  }
  .hero-orb{
    position:absolute; inset:-40% -10% auto auto; width:520px; height:520px;
    background:var(--glow); opacity:.5; filter:blur(10px); pointer-events:none;
  }
  .hero-inner{
    max-width:1200px; margin:0 auto; padding:56px 24px 48px;
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center;
    position:relative; z-index:2;
  }
  .ribbon{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(124,92,255,0.16); border:1px solid rgba(124,92,255,0.5);
    color:#CBBBFF; font-family:'JetBrains Mono'; font-size:0.72rem; letter-spacing:.06em;
    text-transform:uppercase; padding:6px 12px; border-radius:999px; margin-bottom:18px;
  }
  .ribbon .pulse{width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 10px 3px rgba(255,176,32,.7); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .hero h1{font-size:2.4rem; font-weight:800; line-height:1.12; margin-bottom:14px;}
  .hero h1 em{font-style:normal; color:var(--amber);}
  .hero p.tagline{color:#B9C1D9; font-size:1.02rem; max-width:52ch; margin-bottom:22px;}
  .meta-row{display:flex; gap:22px; flex-wrap:wrap; margin-bottom:6px;}
  .meta-item{font-size:0.8rem; color:#8E98B8;}
  .meta-item b{color:var(--white); display:block; font-family:'Sora'; font-size:1rem;}

  .hero-img-wrap{
    position:relative; border-radius:18px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,.45);
    background:linear-gradient(160deg,#161F35,#0E1526);
  }
  .hero-img-wrap svg{width:100%; height:320px; display:block;}
  .hero-img-wrap::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 62%, rgba(11,18,32,.9));
  }
  .img-caption{
    position:absolute; left:14px; bottom:12px; z-index:2;
    font-family:'JetBrains Mono'; font-size:0.68rem; color:#E8EAF5;
    background:rgba(0,0,0,.35); padding:4px 9px; border-radius:6px; backdrop-filter:blur(3px);
  }

  /* ===== Section shell ===== */
  .section{max-width:1200px; margin:0 auto; padding:52px 24px;}
  .section + .section{border-top:1px solid #E7E7F2;}
  .eyebrow{
    font-family:'JetBrains Mono'; font-size:0.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--violet); margin-bottom:8px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:""; width:20px; height:2px; background:var(--amber); display:inline-block;}
  .section h2{font-size:1.55rem; margin-bottom:6px;}
  .section .sub{color:var(--slate); max-width:70ch; margin-bottom:28px; font-size:0.95rem;}

  /* level toggle */
  .level-toggle{
    display:inline-flex; background:#fff; border:1px solid #E1E1EE; border-radius:999px;
    padding:4px; margin-bottom:30px; box-shadow:0 1px 3px rgba(20,20,50,.05);
  }
  .level-toggle button{
    border:none; background:transparent; font-family:'Sora'; font-weight:700; font-size:0.85rem;
    padding:9px 20px; border-radius:999px; cursor:pointer; color:var(--slate); transition:.2s;
  }
  .level-toggle button.active{background:var(--navy); color:var(--white);}

  .track-note{
    background:#FFF7E8; border:1px solid #FFE3AE; border-left:4px solid var(--amber);
    padding:14px 18px; border-radius:10px; font-size:0.88rem; color:#6B5100; margin-bottom:30px;
  }

  /* syllabus modules */
  .module-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(270px,1fr)); gap:16px;}
  .module-card{
    background:#fff; border:1px solid #E7E7F2; border-radius:14px; padding:20px;
    transition:.2s;
  }
  .module-card:hover{border-color:var(--violet); box-shadow:0 10px 26px rgba(124,92,255,.12); transform:translateY(-2px);}
  .module-card h4{font-size:1rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .module-num{
    font-family:'JetBrains Mono'; font-size:.7rem; color:var(--white); background:var(--navy);
    width:22px; height:22px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center;
  }
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    font-family:'JetBrains Mono'; font-size:0.72rem; background:#F0EEFF; color:#4B3AA8;
    padding:4px 9px; border-radius:6px; border:1px solid #E1DBFF;
  }

  /* toolkit strip (real tools used, no external images = never breaks) */
  .toolkit-strip{
    margin-top:22px; border-radius:14px; border:1px solid #E7E7F2;
    background:linear-gradient(135deg,#12192C,#1B2440);
    box-shadow:0 10px 30px rgba(18,26,43,.12);
    padding:22px 24px;
  }
  .toolkit-strip .tk-label{
    font-family:'JetBrains Mono'; font-size:0.68rem; color:#9AA5C0; text-transform:uppercase;
    letter-spacing:.1em; margin-bottom:12px;
  }
  .toolkit-row{display:flex; flex-wrap:wrap; gap:10px;}
  .tk-chip{
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14); color:#EDEFF7; font-family:'Sora'; font-weight:600;
    font-size:0.85rem; padding:9px 14px; border-radius:10px;
  }
  .tk-chip .tk-ic{font-size:1.05rem;}

  /* benefits */
  .benefit-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px;}
  .benefit-card{
    background:linear-gradient(160deg,#fff,#F7F6FF); border:1px solid #E7E7F2; border-radius:14px; padding:20px;
  }
  .benefit-card .ic{font-size:1.4rem; margin-bottom:10px; display:block;}
  .benefit-card h4{font-size:0.95rem; margin-bottom:6px;}
  .benefit-card p{font-size:0.85rem; color:var(--slate);}

  /* what next timeline */
  .path{display:flex; flex-wrap:wrap; gap:0; align-items:stretch;}
  .path-step{
    flex:1 1 200px; background:#fff; border:1px solid #E7E7F2; border-radius:14px; padding:18px;
    position:relative; margin:6px;
  }
  .path-step .stage{font-family:'JetBrains Mono'; font-size:.68rem; color:var(--amber); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .path-step h4{font-size:0.98rem; margin-bottom:6px;}
  .path-step p{font-size:0.82rem; color:var(--slate);}

  /* hiring companies */
  .hire-wrap{
    background:var(--ink); border-radius:18px; padding:30px; color:#fff;
    display:grid; grid-template-columns:1fr 1fr; gap:24px;
  }
  .hire-wrap h3{font-size:1.05rem; margin-bottom:14px; color:var(--amber);}
  .hire-cat{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:10px; padding:12px 14px; margin-bottom:10px; font-size:0.86rem; color:#DDE1F2;
  }
  .hire-cat b{color:#fff; display:block; font-family:'Sora'; font-size:0.92rem; margin-bottom:3px;}

  /* faculty band */
  .faculty-band{
    display:flex; align-items:center; gap:18px; background:#fff; border:1px solid #E7E7F2;
    border-radius:16px; padding:22px; margin-top:10px;
  }
  .faculty-badges{display:flex; gap:8px; flex-shrink:0;}
  .fb{
    width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Sora'; font-weight:800; font-size:0.72rem; color:#fff;
  }
  .fb.iit{background:#1E3A8A;}
  .fb.iim{background:#7C2D12;}
  .fb.jntua{background:#166534;}
  .faculty-band p{font-size:0.88rem; color:var(--slate);}
  .faculty-band strong{color:var(--ink);}

  /* real-time note */
  .realtime-note{
    display:flex; gap:14px; align-items:flex-start;
    background:linear-gradient(120deg, rgba(124,92,255,.08), rgba(255,176,32,.08));
    border:1px dashed #C9BEFF; border-radius:14px; padding:18px 20px; margin-top:26px;
  }
  .realtime-note .flag{font-size:1.3rem;}
  .realtime-note p{font-size:0.86rem; color:#3C3A55;}

  /* CTA footer per course */
  .course-cta{
    text-align:center; padding:46px 24px; background:var(--navy); color:#fff; position:relative; overflow:hidden;
  }
  .course-cta .glow-bg{position:absolute; inset:0; background:var(--glow); opacity:.25;}
  .course-cta h3{font-size:1.4rem; margin-bottom:8px; position:relative;}
  .course-cta p{color:#B9C1D9; margin-bottom:18px; position:relative;}
  .cta-btn{
    position:relative; display:inline-block; font-family:'Sora'; font-weight:700; font-size:0.9rem;
    background:linear-gradient(120deg,var(--amber),#FFD37A); color:var(--navy);
    padding:13px 28px; border-radius:999px; text-decoration:none; box-shadow:0 10px 30px rgba(255,176,32,.35);
    cursor:default;
  }
  .cta-sub{font-size:0.72rem; color:#7C87A8; margin-top:10px; position:relative;}

  /* ===== Alumni / Faculty page ===== */
  .alumni-hero{
    position:relative; overflow:hidden; background:var(--navy); color:#fff; text-align:center;
    padding:64px 24px 46px;
  }
  .alumni-hero .hero-orb{inset:-30% 20% auto auto;}
  .alumni-hero h1{font-size:2.2rem; max-width:20ch; margin:0 auto 14px; position:relative; z-index:2;}
  .alumni-hero p{color:#B9C1D9; max-width:60ch; margin:0 auto; position:relative; z-index:2;}

  .stat-bar{
    max-width:1000px; margin:34px auto 0; display:grid; grid-template-columns:repeat(4,1fr);
    gap:14px; position:relative; z-index:2;
  }
  .stat-box{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:16px 10px;
  }
  .stat-box b{display:block; font-family:'Sora'; font-size:1.5rem; color:var(--amber);}
  .stat-box span{font-size:0.72rem; color:#C6CDE0; text-transform:uppercase; letter-spacing:.06em;}

  .alumni-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:22px;}
  .alumni-card{
    background:#fff; border:1px solid #E7E7F2; border-radius:18px; padding:22px;
    display:flex; flex-direction:column; gap:14px; transition:.2s;
  }
  .alumni-card:hover{transform:translateY(-3px); box-shadow:0 16px 36px rgba(18,26,43,.1); border-color:#D9D3FF;}
  .alumni-top{display:flex; gap:14px; align-items:center;}
  .alumni-top img{
    width:72px; height:72px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:3px solid #fff; box-shadow:0 0 0 2px var(--violet);
  }
  .alumni-name{font-family:'Sora'; font-weight:700; font-size:1.05rem;}
  .alumni-role{font-size:0.8rem; color:var(--violet); font-weight:600;}
  .alumni-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .alumni-badge{
    font-family:'JetBrains Mono'; font-size:0.66rem; padding:3px 8px; border-radius:999px;
    color:#fff;
  }
  .alumni-badge.iit{background:#1E3A8A;}
  .alumni-badge.iim{background:#7C2D12;}
  .alumni-badge.jntua{background:#166534;}
  .alumni-stats{display:flex; gap:16px; font-size:0.78rem; color:var(--slate); border-top:1px dashed #E1E1EE; border-bottom:1px dashed #E1E1EE; padding:10px 0;}
  .alumni-stats b{color:var(--ink); display:block; font-family:'Sora'; font-size:0.95rem;}
  .alumni-card p.bio{font-size:0.87rem; color:var(--slate);}
  .alumni-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .alumni-tag{font-size:0.72rem; background:#F7F6FF; border:1px solid #E6E1FF; color:#4B3AA8; padding:4px 9px; border-radius:7px;}

  .faculty-link-btn{
    display:inline-block; margin-top:14px; font-family:'Sora'; font-weight:700; font-size:0.82rem;
    color:var(--violet); text-decoration:none; border:1px solid #D9D3FF; padding:8px 16px;
    border-radius:999px; cursor:pointer; background:#fff; transition:.2s;
  }
  .faculty-link-btn:hover{background:#F3F0FF;}

  footer.site-footer{
    background:#0B1220; color:#7C87A8; text-align:center; padding:26px; font-size:0.78rem;
    border-top:1px solid var(--line);
  }

  @media (max-width: 860px){
    .hero-inner{grid-template-columns:1fr;}
    .hire-wrap{grid-template-columns:1fr;}
    .hero h1{font-size:1.8rem;}
  }
</style>
</head>

    <div class="alumni-hero">
      <div class="hero-orb"></div>

        <div class="stat-box"><b>6</b><span>Career Programs</span></div>

      <div class="alumni-grid">
        ${ALUMNI.map(a=>`
        <div class="alumni-card">
          <div class="alumni-top">
            <img src="${a.photo}" alt="${a.name}">
            <div>
              <div class="alumni-name">${a.name}</div>
              <div class="alumni-role">${a.role}</div>
              <div class="alumni-badges"><span class="alumni-badge ${a.badge}">${a.badgeLabel}</span></div>

          </div>
          <div class="alumni-stats">
            <div><b>${a.years} yrs</b>Industry Experience</div>
            <div><b>${a.projects}</b>Delivered</div>
          </div>
          <p class="bio">${a.bio}</p>
          <div class="alumni-tags">${a.tags.map(t=>`<span class="alumni-tag">${t}</span>`).join("")}</div>
        </div>`).join("")}
      </div>

      <div class="realtime-note">
        <span class="flag">🎓</span>

    <div class="course-cta">

function buildAll(){
  renderNav();
  const wrap = document.getElementById("pages");
  wrap.innerHTML = COURSES.map(renderCourse).join("") + renderAlumniPage();
  COURSES.forEach(c => refreshModules(c.id));
  document.getElementById(`page-${COURSES[0].id}`).classList.add("active");
}

function refreshModules(id){
  const c = COURSES.find(x=>x.id===id);
  const level = state[id];
  const list = c.modules[level];
  document.getElementById(`modules-${id}`).innerHTML = list.map(moduleCard).join("");
  const note = document.getElementById(`note-${id}`);
  note.textContent = level==="Freshers"
    ? `Freshers Track: Foundation concepts, guided real-world exercises, and placement assistance from zero prior background.`
    : `Experienced Track: Advanced, client-style modules covering real project scenarios, optimisation and certification-level depth.`;
}

function setLevel(id, level, btn){
  state[id] = level;
  const group = btn.parentElement;
  group.querySelectorAll(".lvl-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  refreshModules(id);
}

function showCourse(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(`page-${id}`).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.tab-btn[data-course="${id}"]`).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}

buildAll();
</script>
